name: unittest

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    name: Unit tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go information
        run: |
          go version
          go env
      - name: Run tests
        run: go test ./...
      - name: Run tests with race detector
        if: matrix.os == 'ubuntu'
        run: go test -race ./...
